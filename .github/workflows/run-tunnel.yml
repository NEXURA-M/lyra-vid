name: Lyra AI 6-Hour Auto-Restart & Tunnel

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:        # Allows manual triggering anytime

jobs:
  run-and-update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Grants permission to update the repository README

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Lyra Flask Server in Background
        run: |
          python app.py &
          sleep 10

      - name: Start Cloudflare Tunnel & Capture URL
        run: |
          curl -L --output cloudflare-tunnel https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflare-tunnel
          
          # Run cloudflared in background and log output to a file
          ./cloudflare-tunnel tunnel --url http://localhost:5000 > tunnel.log 2>&1 &
          
          # Wait for the tunnel URL to generate
          echo "Waiting for Cloudflare tunnel URL..."
          for i in {1..15}; do
            URL=$(grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo "Found Tunnel URL: $URL"
              echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
              break
            fi
            sleep 3
          done

      - name: Update README.md with New Live URL
        run: |
          if [ -z "${{ env.TUNNEL_URL }}" ]; then
            echo "Error: Tunnel URL could not be retrieved."
            exit 1
          fi

          # Generate timestamp
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Write/Update README contents
          cat << EOF > README.md
          # Lyra AI Video Generator
          > Created by **Muhammad Taqi**

          State-of-the-art text-to-video generation web application powered by **Wan2.1-T2V-1.3B-Diffusers**.

          ## 🚀 Live Access Link
          * **Active Tunnel URL:** [${{ env.TUNNEL_URL }}](${{ env.TUNNEL_URL }})
          * **Last Refreshed:** \`$TIMESTAMP\`
          *(Note: This URL automatically updates every 6 hours via GitHub Actions)*
          EOF

      - name: Commit and Push README Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🤖 Auto-update Lyra live tunnel URL [skip ci]" || echo "No changes to commit"
          git push
