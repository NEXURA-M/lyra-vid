name: Deploy LYRA Public Web Interface

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'  # Har 6 ghante baad chalega
  workflow_dispatch:      # Manual chalanay ka button

jobs:
  launch-interface:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Repo Content
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Initialize Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Load Web UI Libraries
      run: |
        python -m pip install --upgrade pip
        pip install gradio huggingface_hub requests

    - name: Execute UI and Extract Link
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Python script khud hi link nikal kar README.md overwrite kar dega
      run: |
        timeout 5.75h python app.py || echo "Timeout reached safely for next cycle transition."

    - name: Commit and Push Updated Link to README
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add README.md
        # Agar koi change hua hai to hi commit karega takay workflow error na de
        git diff-index --quiet HEAD || git commit -m "🤖 Sync Engine: New Public URL Updated [Automated]"
        git push origin main
